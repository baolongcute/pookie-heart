<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Heart — Pookie Mode</title>
  <style>
    :root{
      --bg0:#05060d;
      --bg1:#0b1020;
      --bg2:#1a0b18;
      --hot:#ff2d55;
      --hot2:#ff6b86;
      --hot3:#ff1f4b;
      --white: #fff;
      --muted: rgba(255,255,255,.75);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      overflow:hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1200px 800px at 50% 30%, rgba(112,98,255,.18) 0%, transparent 60%),
        radial-gradient(900px 700px at 70% 60%, rgba(255,45,85,.16) 0%, transparent 62%),
        radial-gradient(900px 700px at 30% 70%, rgba(0,255,209,.08) 0%, transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2) 55%, var(--bg0));
      color: var(--white);
      user-select:none;
    }

    /* Canvas particle layer */
    #fx{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      z-index:1;
    }

    /* Center stage */
    .stage{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      z-index:2;
      pointer-events:none; /* allow click to pass through */
    }

    /* soft glow behind heart */
    .aura{
      position:absolute;
      width:min(520px, 80vmin);
      height:min(520px, 80vmin);
      border-radius:50%;
      background: radial-gradient(circle, rgba(255,45,85,.22), rgba(255,45,85,0) 62%);
      filter: blur(10px);
      animation: float 6.5s ease-in-out infinite;
      opacity:.95;
    }
    @keyframes float{
      0%,100%{ transform: translateY(10px) scale(1); }
      50%{ transform: translateY(-14px) scale(1.03); }
    }

    /* 3D Heart (CSS) */
    .heart-wrap{
      position:relative;
      width:min(340px, 62vmin);
      height:min(340px, 62vmin);
      display:grid;
      place-items:center;
      perspective: 900px;
      pointer-events:none;
    }

    .heart3d{
      position:relative;
      width: 220px;
      height: 220px;
      transform-style: preserve-3d;
      animation: spin 7.2s linear infinite, beat 1.05s ease-in-out infinite;
      filter: drop-shadow(0 24px 70px rgba(255,45,85,.35));
    }

    @keyframes spin{
      0%{ transform: rotateX(14deg) rotateY(0deg) rotateZ(-45deg); }
      100%{ transform: rotateX(14deg) rotateY(360deg) rotateZ(-45deg); }
    }
    @keyframes beat{
      0%,100%{ scale: 1; }
      14%{ scale: 1.07; }
      28%{ scale: 1.02; }
      42%{ scale: 1.10; }
      72%{ scale: 1.00; }
    }

    /* base heart shape: rotated square + 2 circles */
    .heart3d .core{
      position:absolute;
      inset:0;
      background: linear-gradient(135deg, var(--hot3), var(--hot2));
      transform: rotate(-45deg);
      border-radius: 18px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        inset 18px 18px 44px rgba(0,0,0,.18);
    }
    .heart3d .core::before,
    .heart3d .core::after{
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      border-radius: 50%;
      background: inherit;
      box-shadow: inherit;
    }
    .heart3d .core::before{ top:-50%; left:0; }
    .heart3d .core::after{ left:50%; top:0; }

    /* fake 3D depth: multiple slices (layers) */
    .slice{
      position:absolute;
      inset:0;
      transform-style:preserve-3d;
    }
    .slice::before{
      content:"";
      position:absolute;
      inset:0;
      transform: translateZ(var(--z));
      opacity: var(--o);
      filter: saturate(1.1);
    }

    /* highlight / specular */
    .spec{
      position:absolute;
      inset:-10px;
      transform: rotate(-45deg);
      border-radius: 26px;
      background:
        radial-gradient(180px 220px at 38% 26%, rgba(255,255,255,.55), rgba(255,255,255,0) 62%),
        radial-gradient(160px 160px at 70% 65%, rgba(255,255,255,.14), rgba(255,255,255,0) 58%),
        radial-gradient(260px 260px at 55% 85%, rgba(0,0,0,.18), rgba(0,0,0,0) 62%);
      mix-blend-mode: screen;
      pointer-events:none;
      opacity:.85;
      transform-style:preserve-3d;
      animation: shimmer 2.2s ease-in-out infinite alternate;
    }
    @keyframes shimmer{
      0%{ opacity:.72; filter: blur(0px); }
      100%{ opacity:.92; filter: blur(.2px); }
    }

    /* Front glass */
    .glass{
      position:absolute;
      inset:-14px;
      transform: rotate(-45deg) translateZ(40px);
      border-radius: 30px;
      background: radial-gradient(circle at 40% 20%, rgba(255,255,255,.18), rgba(255,255,255,0) 55%);
      border: 1px solid rgba(255,255,255,.10);
      opacity:.55;
      pointer-events:none;
    }

    /* UI overlay */
    .hud{
      position:fixed;
      inset:auto 0 0 0;
      padding: 18px 18px 22px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      z-index:3;
      pointer-events:none;
    }

    .hint{
      pointer-events:none;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.25;
      letter-spacing: .2px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 10px 12px;
      max-width: 520px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    .hint b{ color:#fff; }

    .badge{
      pointer-events:none;
      font-size: 12px;
      color: rgba(255,255,255,.80);
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      padding: 8px 12px;
      backdrop-filter: blur(10px);
    }

    /* Big click area */
    .clicklayer{
      position:fixed;
      inset:0;
      z-index:4;
      cursor: pointer;
    }

    /* Message overlay */
    .msg{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      z-index:5;
      pointer-events:none;
      opacity:0;
      transform: translateY(8px);
      transition: opacity .45s ease, transform .45s ease;
    }
    .msg.active{
      opacity:1;
      transform: translateY(0);
    }

    .card{
      pointer-events:none;
      padding: 18px 22px;
      border-radius: 22px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      text-align:center;
      min-width: min(520px, 86vw);
    }

    .headline{
      font-weight: 900;
      font-size: clamp(28px, 4.6vw, 48px);
      letter-spacing: .3px;
      margin: 0;
      text-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .sub{
      margin: 10px 0 0;
      color: rgba(255,255,255,.78);
      font-size: 14px;
      letter-spacing: .2px;
    }

    /* typing caret */
    .caret{
      display:inline-block;
      width: 10px;
      height: 1.1em;
      transform: translateY(2px);
      border-left: 3px solid rgba(255,255,255,.9);
      margin-left: 8px;
      animation: blink .9s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <div class="stage">
    <div class="aura" aria-hidden="true"></div>

    <div class="heart-wrap" aria-hidden="true">
      <div class="heart3d">
        <!-- Core front face -->
        <div class="core"></div>

        <!-- Faux depth layers (stacked Z slices) -->
        <div class="slice" style="--z:-34px; --o:.12"></div>
        <div class="slice" style="--z:-28px; --o:.14"></div>
        <div class="slice" style="--z:-22px; --o:.16"></div>
        <div class="slice" style="--z:-16px; --o:.18"></div>
        <div class="slice" style="--z:-10px; --o:.20"></div>
        <div class="slice" style="--z:-4px;  --o:.22"></div>

        <div class="spec"></div>
        <div class="glass"></div>
      </div>
    </div>
  </div>

  <div class="msg" id="msg">
    <div class="card">
      <h1 class="headline"><span id="typed"></span><span class="caret"></span></h1>
      <p class="sub">Click lần nữa để “overdrive” (bắn dày hơn). Nhấn <b>R</b> để reset.</p>
    </div>
  </div>

  <div class="hud">
    <div class="hint">
      <b>Click</b> vào màn hình để bật “Pookie mode” ✨<br>
      Canvas particle mượt, trái tim 3D ánh sáng, chữ typewriter.
    </div>
    <div class="badge" id="badge">READY</div>
  </div>

  <div class="clicklayer" id="clicklayer" title="Click"></div>

  <script>
    (() => {
      // ========= CONFIG =========
      const TEXT = "I luv youu, Pookie";
      // Spawn rate: dày + tích lũy theo thời gian (vài chục giây là “triệu” spawn)
      let EMIT_RATE = 1200;     // hearts / second (normal)
      let OVERDRIVE_RATE = 4500; // hearts / second (after 2nd click)
      const MAX_PARTICLES = 16000; // cap to keep FPS stable (old particles recycle)
      const GRAVITY = 820;     // px/s^2
      const DRAG = 0.985;      // velocity damping
      const WIND = 22;         // horizontal drift

      // ========= DOM =========
      const canvas = document.getElementById("fx");
      const ctx = canvas.getContext("2d", { alpha: true });
      const msg = document.getElementById("msg");
      const typed = document.getElementById("typed");
      const badge = document.getElementById("badge");
      const clicklayer = document.getElementById("clicklayer");

      // ========= STATE =========
      let W=0, H=0, DPR=1;
      let running = false;
      let overdrive = false;
      let tPrev = performance.now();
      let emitAcc = 0;
      let totalSpawned = 0;

      // particle pool
      const particles = new Array(MAX_PARTICLES);
      let pCount = 0;

      // offscreen heart sprites (multiple sizes/colors for richness)
      const sprites = [];

      function resize(){
        DPR = Math.min(2, window.devicePixelRatio || 1);
        W = canvas.width = Math.floor(window.innerWidth * DPR);
        H = canvas.height = Math.floor(window.innerHeight * DPR);
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        ctx.setTransform(1,0,0,1,0,0);
        ctx.scale(DPR, DPR);
      }
      window.addEventListener("resize", resize);

      function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

      // ========= HEART SPRITE =========
      // Draw a crisp heart with gradient + shadow into a small offscreen canvas.
      function makeHeartSprite(size, hueShift=0){
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const g = c.getContext("2d");

        const s = size;
        const cx = s/2, cy = s/2;
        const scale = s/36;

        // shadow
        g.clearRect(0,0,s,s);
        g.save();
        g.translate(cx, cy);
        g.scale(scale, scale);
        g.translate(-16, -16);

        // gradient fill
        const grad = g.createLinearGradient(6, 0, 26, 32);
        // subtle hue shift by mixing in HSL-ish via rgb tweaks
        grad.addColorStop(0, `rgba(255,45,85,0.98)`);
        grad.addColorStop(0.55, `rgba(255,107,134,0.98)`);
        grad.addColorStop(1, `rgba(255,31,75,0.98)`);

        g.shadowColor = "rgba(0,0,0,.35)";
        g.shadowBlur = 10;
        g.shadowOffsetX = 0;
        g.shadowOffsetY = 6;

        // heart path (approx)
        g.beginPath();
        g.moveTo(16, 29);
        g.bezierCurveTo(6, 22, 4, 14, 9, 10);
        g.bezierCurveTo(13, 6, 18, 8, 16, 13);
        g.bezierCurveTo(14, 8, 19, 6, 23, 10);
        g.bezierCurveTo(28, 14, 26, 22, 16, 29);
        g.closePath();

        g.fillStyle = grad;
        g.fill();

        // spec highlight
        g.shadowColor = "transparent";
        const h = g.createRadialGradient(14, 10, 0, 14, 10, 12);
        h.addColorStop(0, "rgba(255,255,255,.50)");
        h.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = h;
        g.beginPath();
        g.ellipse(13, 11, 6, 5, -0.6, 0, Math.PI*2);
        g.fill();

        g.restore();

        // optional hue shift via globalCompositeOperation (tiny spice)
        if(hueShift !== 0){
          g.save();
          g.globalCompositeOperation = "color";
          g.fillStyle = `hsla(${hueShift}, 90%, 60%, 0.12)`;
          g.fillRect(0,0,s,s);
          g.restore();
        }

        return c;
      }

      function initSprites(){
        sprites.length = 0;
        // sizes and slight hue variations for “rich” look
        const sizes = [18, 22, 26, 32, 40];
        const hues  = [0, 340, 320, 10];
        for(const sz of sizes){
          for(const h of hues){
            sprites.push(makeHeartSprite(sz, h));
          }
        }
      }

      // ========= PARTICLES =========
      function spawnOne(x, y){
        // recycle if at cap
        const p = (pCount < MAX_PARTICLES) ? (particles[pCount] = {}) : particles[Math.floor(Math.random()*MAX_PARTICLES)];

        const angle = (-Math.PI/2) + (Math.random() - 0.5) * 1.15; // mostly upward
        const speed = (overdrive ? 520 : 380) + Math.random() * (overdrive ? 560 : 420);

        p.x = x;
        p.y = y;
        p.vx = Math.cos(angle) * speed + (Math.random()-0.5)*160;
        p.vy = Math.sin(angle) * speed - Math.random()*220;

        p.rot = (Math.random()*Math.PI*2);
        p.vr  = (Math.random()-0.5) * 6.5; // rotation speed

        p.size = 0.7 + Math.random()*1.25;
        p.life = 0;
        p.ttl  = (overdrive ? 1.7 : 1.35) + Math.random()*1.15;

        p.sprite = sprites[(Math.random()*sprites.length) | 0];
        p.alpha  = 0.95;
        p.pop    = overdrive ? 1.08 : 1.0;

        if (pCount < MAX_PARTICLES) pCount++;
        totalSpawned++;
      }

      function burst(x, y, amount){
        for(let i=0;i<amount;i++) spawnOne(x, y);
      }

      // ========= TYPEWRITER =========
      async function typewriter(text, ms=42){
        typed.textContent = "";
        for(let i=0;i<text.length;i++){
          typed.textContent += text[i];
          await new Promise(r => setTimeout(r, ms));
        }
      }

      // ========= LOOP =========
      function step(now){
        const dt = Math.min(0.035, (now - tPrev) / 1000);
        tPrev = now;

        // emit continuously once running
        if(running){
          const rate = overdrive ? OVERDRIVE_RATE : EMIT_RATE;
          emitAcc += rate * dt;

          // emit from a point near the heart center (screen center)
          const cx = window.innerWidth * 0.5;
          const cy = window.innerHeight * 0.48;

          // consume integer emissions
          const n = Math.floor(emitAcc);
          emitAcc -= n;

          // distribute a bit to look organic
          for(let i=0;i<n;i++){
            const rx = (Math.random()-0.5) * 40;
            const ry = (Math.random()-0.5) * 24;
            spawnOne(cx + rx, cy + ry);
          }
        }

        // paint
        ctx.clearRect(0,0,window.innerWidth,window.innerHeight);

        // subtle vignette for depth
        ctx.save();
        const vg = ctx.createRadialGradient(
          window.innerWidth*0.5, window.innerHeight*0.45, 80,
          window.innerWidth*0.5, window.innerHeight*0.5, Math.max(window.innerWidth, window.innerHeight)*0.8
        );
        vg.addColorStop(0, "rgba(0,0,0,0)");
        vg.addColorStop(1, "rgba(0,0,0,.28)");
        ctx.fillStyle = vg;
        ctx.fillRect(0,0,window.innerWidth, window.innerHeight);
        ctx.restore();

        // update particles
        for(let i=0;i<pCount;i++){
          const p = particles[i];
          if(!p) continue;

          p.life += dt;
          const t = p.life / p.ttl;

          // physics
          p.vx += (WIND * (Math.random()*0.6 + 0.2)) * dt;
          p.vy += GRAVITY * dt;
          p.vx *= DRAG;
          p.vy *= DRAG;

          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.vr * dt;

          // fade + slight scale pop
          const fade = 1 - t;
          p.alpha = clamp(fade, 0, 1);

          // draw if alive and on screen-ish
          if(p.alpha > 0.01 && p.y < window.innerHeight + 180){
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);

            const spr = p.sprite;
            const w = spr.width * p.size * p.pop;
            const h = spr.height * p.size * p.pop;

            ctx.drawImage(spr, -w/2, -h/2, w, h);
            ctx.restore();
          } else {
            // recycle by swapping with last
            const last = pCount - 1;
            particles[i] = particles[last];
            particles[last] = p;
            pCount--;
            i--;
          }
        }

        // badge update
        badge.textContent = running
          ? (overdrive
              ? `OVERDRIVE • active • spawned: ${totalSpawned.toLocaleString()}`
              : `LIVE • spawned: ${totalSpawned.toLocaleString()}`
            )
          : "READY";

        requestAnimationFrame(step);
      }

      // ========= INTERACTION =========
      let firstClickDone = false;

      function activate(e){
        const x = e?.clientX ?? window.innerWidth*0.5;
        const y = e?.clientY ?? window.innerHeight*0.5;

        if(!firstClickDone){
          firstClickDone = true;
          running = true;
          overdrive = false;

          msg.classList.add("active");
          typewriter(TEXT, 38);

          // initial mega burst (looks like fireworks)
          burst(x, y, 1400);
          burst(window.innerWidth*0.5, window.innerHeight*0.48, 2200);
          badge.textContent = "LIVE";
        } else {
          // second click => overdrive
          overdrive = !overdrive;
          burst(x, y, overdrive ? 2600 : 1400);
        }
      }

      function reset(){
        running = false;
        overdrive = false;
        firstClickDone = false;
        msg.classList.remove("active");
        typed.textContent = "";
        pCount = 0;
        totalSpawned = 0;
        emitAcc = 0;
        badge.textContent = "READY";
      }

      clicklayer.addEventListener("click", activate);
      window.addEventListener("keydown", (ev) => {
        if(ev.key.toLowerCase() === "r") reset();
      });

      // ========= INIT =========
      resize();
      initSprites();
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
